<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  .icon-container { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  svg { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
  <div class="icon-container" id="container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Golden Ruler Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Cyan Glow Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="3" />

  <!-- Atom Orbital Ellipses in Background -->
  <ellipse cx="256" cy="256" rx="190" ry="75" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="3" transform="rotate(-30 256 256)" />
  <ellipse cx="256" cy="256" rx="190" ry="75" fill="none" stroke="rgba(129, 140, 248, 0.25)" stroke-width="3" transform="rotate(30 256 256)" />
  <circle cx="390" cy="180" r="7" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="120" cy="330" r="6" fill="#818cf8" filter="url(#glow)" />

  <!-- Central Scientific Drafting Triangle (Set Square) -->
  <g transform="translate(256, 260)">
    <!-- Shadow -->
    <path d="M -130 90 L 130 90 L -130 -170 Z" fill="rgba(0, 0, 0, 0.4)" filter="url(#glow)" transform="translate(8, 8)" />

    <!-- Main Outer Triangle -->
    <path d="M -130 90 L 130 90 L -130 -170 Z" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="4" stroke-linejoin="round" />

    <!-- Inner Triangle Cutout -->
    <path d="M -95 65 L 60 65 L -95 -90 Z" fill="#0f172a" stroke="#ca8a04" stroke-width="2" stroke-linejoin="round" />

    <!-- Ruler Measurement Ticks Along Bottom Edge -->
    <line x1="-120" y1="90" x2="-120" y2="76" stroke="#713f12" stroke-width="3" />
    <line x1="-100" y1="90" x2="-100" y2="82" stroke="#713f12" stroke-width="2" />
    <line x1="-80" y1="90" x2="-80" y2="76" stroke="#713f12" stroke-width="3" />
    <line x1="-60" y1="90" x2="-60" y2="82" stroke="#713f12" stroke-width="2" />
    <line x1="-40" y1="90" x2="-40" y2="76" stroke="#713f12" stroke-width="3" />
    <line x1="-20" y1="90" x2="-20" y2="82" stroke="#713f12" stroke-width="2" />
    <line x1="0" y1="90" x2="0" y2="74" stroke="#713f12" stroke-width="3.5" />
    <line x1="20" y1="90" x2="20" y2="82" stroke="#713f12" stroke-width="2" />
    <line x1="40" y1="90" x2="40" y2="76" stroke="#713f12" stroke-width="3" />
    <line x1="60" y1="90" x2="60" y2="82" stroke="#713f12" stroke-width="2" />
    <line x1="80" y1="90" x2="80" y2="76" stroke="#713f12" stroke-width="3" />
    <line x1="100" y1="90" x2="100" y2="82" stroke="#713f12" stroke-width="2" />
    <line x1="120" y1="90" x2="120" y2="76" stroke="#713f12" stroke-width="3" />

    <!-- Ruler Measurement Ticks Along Vertical Edge -->
    <line x1="-130" y1="80" x2="-116" y2="80" stroke="#713f12" stroke-width="3" />
    <line x1="-130" y1="50" x2="-120" y2="50" stroke="#713f12" stroke-width="2" />
    <line x1="-130" y1="20" x2="-116" y2="20" stroke="#713f12" stroke-width="3" />
    <line x1="-130" y1="-10" x2="-120" y2="-10" stroke="#713f12" stroke-width="2" />
    <line x1="-130" y1="-40" x2="-116" y2="-40" stroke="#713f12" stroke-width="3" />
    <line x1="-130" y1="-70" x2="-120" y2="-70" stroke="#713f12" stroke-width="2" />
    <line x1="-130" y1="-100" x2="-116" y2="-100" stroke="#713f12" stroke-width="3" />
    <line x1="-130" y1="-130" x2="-120" y2="-130" stroke="#713f12" stroke-width="2" />
    <line x1="-130" y1="-160" x2="-116" y2="-160" stroke="#713f12" stroke-width="3" />
  </g>

  <!-- Glowing Formula Element (λ / F / ∑) -->
  <g transform="translate(210, 240)">
    <text x="0" y="0" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="52" font-weight="800" fill="#38bdf8" filter="url(#glow)">∑</text>
  </g>

  <!-- App Title Bottom Text -->
  <text x="256" y="440" font-family="'Inter', -apple-system, sans-serif" font-size="38" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3">FORMULAB</text>
  <text x="256" y="470" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="600" fill="#38bdf8" text-anchor="middle" letter-spacing="4">ҰБТ • ЕНТ 2026</text>
</svg>

  </div>
</body>
</html>
